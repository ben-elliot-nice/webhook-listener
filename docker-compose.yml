services:
  backend:
    build: ./backend
    environment:
      - PORT=3000
      - DB_PATH=/data/webhook-listener.db
      - BASE_URL=http://localhost:8080
    volumes:
      - sqlite-data:/data
    expose:
      - "3000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  sqlite-data:
