name = "webhook-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# No `routes` block here: the custom domain webhook-api.fde.nice-agentic.com
# is attached out-of-band via Cloudflare's account-level Custom Domains API
# (PUT /accounts/{id}/workers/domains/records), the same mechanism used for
# the frontend Worker (see frontend/wrangler.toml). The deploy-time API token
# lacks the Zone:Workers Routes permission wrangler needs to (re-)register a
# `routes` entry here on every deploy, but does have Custom Domains
# permission, so the binding is registered once, directly, and persists on
# Cloudflare's side independent of this file. This is deliberate, not an
# oversight.

[[d1_databases]]
binding = "DB"
database_name = "webhook-listener"
database_id = "8584b678-1372-4348-a7ef-7a4e51bc23f2"

# WL_SESSION_SECRET and RESEND_API_KEY are intentionally NOT declared here.
# Cloudflare rejects `wrangler secret put` for a binding name that's already
# registered as a plaintext var in this file (error code 10053) — so a var
# entry for either name, even a "dev-only" placeholder, permanently blocks
# ever setting the real secret. Set both with:
#   wrangler secret put WL_SESSION_SECRET
#   wrangler secret put RESEND_API_KEY
# For local dev, put dev-only values in backend/.dev.vars (gitignored,
# auto-loaded by `wrangler dev`) — same pattern env.staging already uses.
[vars]
HOOK_BASE_URL = "https://webhook-api.fde.nice-agentic.com"
APP_BASE_URL = "https://webhook.fde.nice-agentic.com"
SESSION_COOKIE_DOMAIN = "fde.nice-agentic.com"
ALLOWED_EMAIL_DOMAINS = "nice.com,cognigy.com"
