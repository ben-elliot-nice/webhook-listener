name = "webhook"
compatibility_date = "2024-09-23"

# No `routes` block here (unlike backend/wrangler.toml): the custom domain
# webhook.fde.nice-agentic.com is attached out-of-band via Cloudflare's
# account-level Custom Domains API (PUT /accounts/{id}/workers/domains/records)
# at deploy time, rather than via wrangler's routes mechanism. The deploy-time
# API token lacks the Zone:Workers Routes permission that wrangler falls back
# to for assets-only Workers, but does have Custom Domains permission, so the
# direct API call is used instead. This is deliberate and working, not an
# oversight.

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
