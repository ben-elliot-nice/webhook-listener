name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Validate commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose

      # PRs are squash-merged, so the PR title becomes the commit subject on main
      # that semantic-release reads to decide the version bump. It must be a
      # conventional commit.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # backend/.dev.vars is gitignored and per-machine (see CLAUDE.md) — it
      # never exists on a CI runner. Without it, WL_SESSION_SECRET is empty
      # and every HMAC-signing test fails. These are dummy, non-production
      # values. Unlike the local-dev .dev.vars (which blanks
      # SESSION_COOKIE_DOMAIN so cookies work on http://localhost in a real
      # browser), CI runs headless tests only, so SESSION_COOKIE_DOMAIN is
      # left at its real production-like value — matching wrangler.toml's
      # default — so the cookie-Domain test actually exercises real
      # behavior instead of the local-browser accommodation.
      - name: Write test .dev.vars
        working-directory: backend
        run: |
          cat > .dev.vars <<'EOF'
          APP_BASE_URL=http://localhost:5173
          HOOK_BASE_URL=http://localhost:8787
          SESSION_COOKIE_DOMAIN=fde.nice-agentic.com
          ALLOWED_EMAIL_DOMAINS=nice.com
          WL_SESSION_SECRET=ci-test-secret-not-for-production
          RESEND_API_KEY=ci-test-key-not-for-production
          EOF

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Collect changed files for Prettier
        id: prettier_files
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
              | grep -E '\.(cjs|js|json|md|mjs|ts|tsx|yaml|yml)$' || true
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "count=${#files[@]}"
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Prettier check
        if: steps.prettier_files.outputs.count != '0'
        shell: bash
        run: |
          mapfile -t files <<'EOF'
          ${{ steps.prettier_files.outputs.files }}
          EOF
          npx prettier --check "${files[@]}"
